      <text x="204" y="106" class="mono" font-size="11" fill="#B8913F" font-weight="700">02</text>
      <text x="204" y="127">Policy gate</text>

      <rect x="348" y="82" width="132" height="56" rx="8" fill="#1A1A1A"/>
      <text x="364" y="106" class="mono" font-size="11" fill="#E0A48C" font-weight="700">03</text>
