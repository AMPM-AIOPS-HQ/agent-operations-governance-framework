<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">AOGF — Agent Operations Governance Framework</title>
  <desc id="d">Reference flow: work order, policy gate, human approval, scoped execution, receipt, review.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A1A1A" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1A1A1A"/>
    </marker>
    <style>
      .sans{font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <rect width="1280" height="420" fill="#FBF3E6"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1A1A1A"/>

  <!-- left: identity -->
  <text x="72" y="92" class="mono" font-size="14" letter-spacing="3" fill="#6B6358">OPEN GOVERNANCE FRAMEWORK · v0.1</text>
  <text x="68" y="190" class="sans" font-size="104" font-weight="800" letter-spacing="-2" fill="#1A1A1A">AOGF</text>
  <text x="72" y="232" class="sans" font-size="26" font-weight="600" fill="#1A1A1A">Agent Operations Governance Framework</text>
  <text x="72" y="268" class="sans" font-size="18" fill="#4A443C">Scoped work orders, review gates, human approval</text>
  <text x="72" y="294" class="sans" font-size="18" fill="#4A443C">and reviewable receipts for AI agents in production.</text>
  <rect x="72" y="326" width="56" height="4" fill="#5B7A72"/>
  <text x="72" y="364" class="mono" font-size="13" letter-spacing="1.5" fill="#6B6358">AMPM AIOps · ampm-aiops.com</text>

  <!-- right: reference flow card -->
  <g transform="translate(700 64)">
    <rect width="508" height="292" rx="14" fill="#FFFDF8" stroke="#1A1A1A" stroke-width="2"/>
    <text x="28" y="44" class="mono" font-size="12" letter-spacing="2" fill="#6B6358">REFERENCE FLOW</text>
    <line x1="28" y1="58" x2="480" y2="58" stroke="#1A1A1A" stroke-opacity=".15"/>

    <!-- row 1 -->
    <g class="sans" font-size="15" font-weight="600" fill="#1A1A1A">
      <rect x="28" y="82" width="132" height="56" rx="8" fill="#FBF3E6" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="44" y="106" class="mono" font-size="11" fill="#6B6358" font-weight="400">01</text>
      <text x="44" y="127">Work order</text>

      <rect x="188" y="82" width="132" height="56" rx="8" fill="#FBF3E6" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="204" y="106" class="mono" font-size="11" fill="#6B6358" font-weight="400">02</text>
      <text x="204" y="127">Policy gate</text>

      <rect x="348" y="82" width="132" height="56" rx="8" fill="#1A1A1A"/>
      <text x="364" y="106" class="mono" font-size="11" fill="#C9C1B4" font-weight="400">03</text>
      <text x="364" y="127" fill="#FBF3E6">Approval</text>

      <!-- row 2 -->
      <rect x="348" y="186" width="132" height="56" rx="8" fill="#FBF3E6" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="364" y="210" class="mono" font-size="11" fill="#6B6358" font-weight="400">04</text>
      <text x="364" y="231">Scoped run</text>

      <rect x="188" y="186" width="132" height="56" rx="8" fill="#FBF3E6" stroke="#5B7A72" stroke-width="2"/>
      <text x="204" y="210" class="mono" font-size="11" fill="#5B7A72" font-weight="400">05</text>
      <text x="204" y="231">Receipt</text>

      <rect x="28" y="186" width="132" height="56" rx="8" fill="#FBF3E6" stroke="#1A1A1A" stroke-width="1.5"/>
      <text x="44" y="210" class="mono" font-size="11" fill="#6B6358" font-weight="400">06</text>
      <text x="44" y="231">Review</text>
    </g>
    <g stroke="#1A1A1A" stroke-width="1.5" fill="none" marker-end="url(#arr)">
      <path d="M160 110H184"/>
      <path d="M320 110H344"/>
      <path d="M414 138V182"/>
      <path d="M348 214H324"/>
      <path d="M188 214H164"/>
    </g>
    <text x="28" y="272" class="mono" font-size="11" fill="#6B6358">stop · revoke · escalate at any step</text>
  </g>
</svg>
