  <circle cx="188" cy="150" r="50" fill="#5B7A72" fill-opacity=".14"/><circle cx="188" cy="150" r="55" fill="none" stroke="#B8913F" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="66" y="208" width="78" height="6" rx="3" fill="#B0644A" fill-opacity=".85"/><rect x="236" y="208" width="66" height="6" rx="3" fill="#5E7391" fill-opacity=".85"/><rect x="306" y="208" width="44" height="6" rx="3" fill="#B8913F" fill-opacity=".85"/><text x="68" y="190" class="sans" font-size="104" font-weight="800" fill="#1A1A1A">A</text><image x="146" y="108" width="84" height="84" href="data:image/png;base64,"/><text x="236" y="190" class="sans" font-size="104" font-weight="800" letter-spacing="-2" fill="#1A1A1A">GF</text>
  <text x="72" y="250" class="sans" font-size="26" font-weight="600" fill="#1A1A1A">Agent Operations Governance Framework</text>
  <text x="72" y="278" class="sans" font-size="17" fill="#4A443C">A vendor-neutral governance whitepaper for AI agents in production.</text>
<g transform="translate(72 300)"><rect width="118" height="32" rx="16" fill="#5B7A72" fill-opacity=".12" stroke="#5B7A72" stroke-width="1.5"/><circle cx="16" cy="16" r="4" fill="#5B7A72"/><text x="28" y="21" class="sans" font-size="14" font-weight="600" fill="#2A2622">Work orders</text></g><g transform="translate(198 300)"><rect width="126" height="32" rx="16" fill="#B8913F" fill-opacity=".12" stroke="#B8913F" stroke-width="1.5"/><circle cx="16" cy="16" r="4" fill="#B8913F"/><text x="28" y="21" class="sans" font-size="14" font-weight="600" fill="#2A2622">Review gates</text></g><g transform="translate(332 300)"><rect width="96" height="32" rx="16" fill="#B0644A" fill-opacity=".12" stroke="#B0644A" stroke-width="1.5"/><circle cx="16" cy="16" r="4" fill="#B0644A"/><text x="28" y="21" class="sans" font-size="14" font-weight="600" fill="#2A2622">Approval</text></g><g transform="translate(436 300)"><rect width="96" height="32" rx="16" fill="#5E7391" fill-opacity=".12" stroke="#5E7391" stroke-width="1.5"/><circle cx="16" cy="16" r="4" fill="#5E7391"/><text x="28" y="21" class="sans" font-size="14" font-weight="600" fill="#2A2622">Receipts</text></g>
  <text x="72" y="380" class="mono" font-size="13" letter-spacing="1.5" fill="#6B6358">AMPM AIOps · ampm-aiops.com</text>

