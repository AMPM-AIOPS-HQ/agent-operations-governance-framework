<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="pt pd">
  <title id="pt">AOGF four pillars</title>
  <desc id="pd">Work orders, review gates, human approval, receipts.</desc>
  <defs>
    <style>
      .sans{font-family:"Inter","Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
    </style>
  </defs>
  <rect width="1280" height="250" fill="#FBF3E6"/>
  <g class="sans">
    <!-- card 1 -->
    <g transform="translate(24 24)">
      <rect width="296" height="202" rx="14" fill="#5B7A72" fill-opacity=".12" stroke="#5B7A72" stroke-width="2"/>
      <rect x="16" y="-3" width="264" height="6" rx="3" fill="#5B7A72"/>
      <text x="148" text-anchor="middle" y="54" class="mono" font-size="14" font-weight="700" fill="#5B7A72">01 · WORK ORDERS</text>
      <text x="148" text-anchor="middle" y="98" font-size="23" font-weight="800" fill="#1A1A1A">Scope before action</text>
      <text x="148" text-anchor="middle" y="136" font-size="16" fill="#3A3530">Purpose, owner, allowed tools,</text>
      <text x="148" text-anchor="middle" y="160" font-size="16" fill="#3A3530">prohibited actions and stop</text>
      <text x="148" text-anchor="middle" y="184" font-size="16" fill="#3A3530">conditions in one work order.</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(336 24)">
      <rect width="296" height="202" rx="14" fill="#B8913F" fill-opacity=".12" stroke="#B8913F" stroke-width="2"/>
      <rect x="16" y="-3" width="264" height="6" rx="3" fill="#B8913F"/>
      <text x="148" text-anchor="middle" y="54" class="mono" font-size="14" font-weight="700" fill="#9A7630">02 · REVIEW GATES</text>
      <text x="148" text-anchor="middle" y="98" font-size="23" font-weight="800" fill="#1A1A1A">No pass, no run</text>
      <text x="148" text-anchor="middle" y="136" font-size="16" fill="#3A3530">Completeness, identity, data</text>
      <text x="148" text-anchor="middle" y="160" font-size="16" fill="#3A3530">handling and tool limits,</text>
      <text x="148" text-anchor="middle" y="184" font-size="16" fill="#3A3530">checked across 8 gates.</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(648 24)">
      <rect width="296" height="202" rx="14" fill="#B0644A"/>
      <text x="148" text-anchor="middle" y="54" class="mono" font-size="14" font-weight="700" fill="#F6E3D8">03 · HUMAN APPROVAL</text>
      <text x="148" text-anchor="middle" y="98" font-size="23" font-weight="800" fill="#FFFDF8">Humans approve risk</text>
      <text x="148" text-anchor="middle" y="136" font-size="16" fill="#F6E3D8">Deletes, releases, payments,</text>
      <text x="148" text-anchor="middle" y="160" font-size="16" fill="#F6E3D8">permission changes. Approval</text>
      <text x="148" text-anchor="middle" y="184" font-size="16" fill="#F6E3D8">expires when the order changes.</text>
    </g>
    <!-- card 4 -->
    <g transform="translate(960 24)">
      <rect width="296" height="202" rx="14" fill="#5E7391" fill-opacity=".12" stroke="#5E7391" stroke-width="2"/>
      <rect x="16" y="-3" width="264" height="6" rx="3" fill="#5E7391"/>
      <text x="148" text-anchor="middle" y="54" class="mono" font-size="14" font-weight="700" fill="#5E7391">04 · RECEIPTS</text>
      <text x="148" text-anchor="middle" y="98" font-size="23" font-weight="800" fill="#1A1A1A">Evidence, not claims</text>
      <text x="148" text-anchor="middle" y="136" font-size="16" fill="#3A3530">Versions, gate results,</text>
      <text x="148" text-anchor="middle" y="160" font-size="16" fill="#3A3530">approvals and acceptance,</text>
      <text x="148" text-anchor="middle" y="184" font-size="16" fill="#3A3530">failures recorded as failures.</text>
    </g>
  </g>
</svg>
